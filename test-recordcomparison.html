    <!-- Load external dependencies with local fallback -->
    <script>
        let dependenciesLoaded = false;
        
        // Function to load jsondiffpatch with multiple fallbacks
        function loadJsonDiffPatch() {
            console.log('Loading jsondiffpatch...');
            
            // First try local fallback (always available)
            const localScript = document.createElement('script');
            localScript.src = 'lib/jsondiffpatch-fallback.js';
            localScript.onload = function() {
                console.log('✅ Local fallback jsondiffpatch loaded');
                // Now try to load the real library to override if possible
                tryLoadRealLibrary();
            };
            localScript.onerror = function() {
                console.log('⚠️ Local fallback not found, trying CDN...');
                tryLoadRealLibrary();
            };
            document.head.appendChild(localScript);
        }
        
        function tryLoadRealLibrary() {
            // Try primary CDN
            const script1 = document.createElement('script');
            script1.src = 'https://unpkg.com/jsondiffpatch@0.4.1/dist/jsondiffpatch.umd.min.js';
            script1.onload = function() {
                console.log('✅ jsondiffpatch loaded from primary CDN (upgraded)');
                loadRecordComparisonFiles();
            };
            script1.onerror = function() {
                console.log('⚠️ Primary CDN failed, trying jsdelivr...');
                // Try fallback CDN
                const script2 = document.createElement('script');
                script2.src = 'https://cdn.jsdelivr.net/npm/jsondiffpatch@0.4.1/dist/jsondiffpatch.umd.min.js';
                script2.onload = function() {
                    console.log('✅ jsondiffpatch loaded from jsDelivr CDN (upgraded)');
                    loadRecordComparisonFiles();
                };
                script2.onerror = function() {
                    console.log('⚠️ All CDNs failed, using local fallback');
                    // Ensure fallback is available
                    if (typeof jsondiffpatch === 'undefined') {
                        createBasicMock();
                    }
                    loadRecordComparisonFiles();
                };
                document.head.appendChild(script2);
            };
            document.head.appendChild(script1);
        }
        
        // Create a very basic mock if everything else fails
        function createBasicMock() {
            window.jsondiffpatch = {
                create: function() {
                    return {
                        diff: function(left, right) {
                            return JSON.stringify(left) !== JSON.stringify(right) ? { _: [left, right] } : undefined;
                        }
                    };
                },
                formatters: {
                    html: {
                        format: function(diff) {
                            if (!diff) return '<div>No changes</div>';
                            return '<div style="padding:10px;background:#fff3cd;border:1px solid #ffc107;">Changes detected (basic mode)</div>';
                        }
                    }
                }
            };
            console.log('✅ Basic mock jsondiffpatch created');
        }
        
        // Load CSS and JS files after jsondiffpatch is ready
        function loadRecordComparisonFiles() {
            if (dependenciesLoaded) return; // Prevent multiple loads
            dependenciesLoaded = true;
            
            // Load your CSS first
            const localCSS = document.createElement('link');
            localCSS.rel = 'stylesheet';
            localCSS.href = 'src/css/RecordComparison.css';
            localCSS.onload = function() {
                console.log('✅ RecordComparison.css loaded');
            };
            localCSS.onerror = function() {
                console.log('⚠️ RecordComparison.css not found');
            };
            document.head.appendChild(localCSS);
            
            // Try to load jsondiffpatch CSS (optional)
            const css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = 'https://unpkg.com/jsondiffpatch@0.4.1/dist/formatters-styles/html.css';
            css.onerror = function() {
                console.log('⚠️ jsondiffpatch CSS not loaded (this is optional)');
            };
            document.head.appendChild(css);
            
            // Load your JS file
            const script = document.createElement('script');
            script.src = 'src/js/RecordComparison.js';
            script.onload = function() {
                console.log('✅ RecordComparison.js loaded');
                // Initialize after everything is loaded
                setTimeout(initializeTestEnvironment, 500);
            };
            script.onerror = function() {
                console.error('❌ Failed to load RecordComparison.js');
            };
            document.body.appendChild(script);
        }
        
        // Start loading when DOM is ready
        document.addEventListener('DOMContentLoaded', loadJsonDiffPatch);
    </script>

                    // Initialize with test configuration
                    const config = {
                        title: 'Data Debugger - Test Environment',
                        theme: 'modern',
                        enableDrillDown: true
                    };
                    
                    try {
                        Initialize(JSON.stringify(config));
                        testComparison = window.recordComparison;
                        showStatus('Test environment initialized successfully!');
                        console.log('🎉 Test environment ready! Available functions:', {
                            Initialize: typeof Initialize,
                            LoadComparison: typeof LoadComparison,
                            ClearData: typeof ClearData,
                            jsondiffpatch: typeof jsondiffpatch,
                            recordComparison: typeof window.recordComparison
                        });
                    } catch (error) {
                        console.error('Failed to initialize:', error);
                        showStatus('Initialization failed - check console');
                    }
                } else {
                    console.error('Initialize function not available');
                    showStatus('Initialize function not found - RecordComparison.js may not have loaded');
                }
            }, 1000);
        }
        
        // Fallback initialization if the dynamic loading doesn't work
        window.onload = function() {
            // Only initialize if not already done by the dynamic loader
            setTimeout(() => {
                if (!testComparison && typeof Initialize === 'function') {
                    initializeTestEnvironment();
                }
